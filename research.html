<body><main id="stage"><header><button class="brand" id="brand" aria-label="Steer 홈">STEER</button><nav aria-label="주요 메뉴"><button id="tab-research" class="active">Research</button><button id="tab-interview">Logic</button><button id="tab-service">Scenario</button><button id="tab-team">Team</button></nav></header><div id="viewport"><div id="content" aria-live="polite"></div></div><button class="edge prev" id="prev" aria-label="이전 리서치 페이지">‹</button><button class="edge next" id="next" aria-label="다음 리서치 페이지">›</button><footer id="footer"><div class="indices" id="indices" aria-label="리서치 페이지 이동"></div></footer></main>
<script>
const pages=[
{tag:"스티어가 바라본 운",title:"정해진 명,<br>움직이는 ‘운’",desc:"타고난 바탕(命) 위에서, 움직이는 흐름(運)의 방향은 스스로 고를 수 있습니다.",source:"命과 運 · ‘움직이다’의 뜻 · 명리학",more:"<p>명(命)은 태어난 시각과 조건처럼 주어진 바탕, 운(運)은 시간의 흐름 속에서 변화하는 조건을 뜻합니다.</p><p>Steer는 운세를 정해진 결과로 읽는 대신, 개인이 오늘 선택하고 움직일 수 있는 계기로 해석합니다. 이는 명리학에 대한 디자인적 해석이지 실증된 인과관계가 아닙니다.</p>",right:'<div class="placeholder big"><span class="photo-label">사진 · 길 위를 걷는 사람의 뒷모습 (움직임)</span><span class="pill photo-pill">運 · 움직이는 흐름</span></div><div class="r1-grid"><div class="r1-black"><span class="character">運</span><div class="desc"><strong>運</strong><br>운 · 옮기다 / 움직이다<br><small>대운 · 세운처럼 시간에 따라 바뀌는 흐름</small></div></div><div class="r1-blue"><span class="character">命</span><span class="desc"><b>命 · 목숨 / 명령</b><br>태어난 때로 정해지는 바탕<br>사주 원국 · 나의 바탕</span></div><div class="placeholder r1-grey">사진 · 만세력 · 사주 명식 화면</div></div>'},
{tag:"사회 · 심리",title:"믿지 않아도<br>운세를 보는 20대",desc:"20대의 점·사주 신뢰는 27%였지만, AI로 운세를 본 경험은 46%였습니다.",source:"한국갤럽 2026 · 불안과 점 · 미신적 전략",more:"<p>운세의 정확성을 믿는 태도와 운세 콘텐츠를 소비하는 행동은 반드시 일치하지 않습니다. 불확실한 상황에서 해석의 실마리나 대화의 소재로 이용할 수 있습니다.</p><p>각 수치는 조사 문항과 표본이 다를 수 있으므로 27%와 46%의 차이를 동일 집단의 실제 행동 전환율로 해석해서는 안 됩니다.</p>",right:'<div class="placeholder big"><span>사진 · 휴대폰으로 AI 운세를 보는 20대</span><span class="pill photo-pill">AI 운세 이용 46%</span></div><div class="tiles" style="margin-top:12px"><div class="tile"><strong>40%</strong><small>2026년 점·사주 신뢰</small><div class="meter"><span style="width:40%"></span></div></div><div class="tile"><strong>41%</strong><small>운명은 ‘반반’이 최다</small><div class="meter"><span style="width:41%"></span></div></div></div><div class="split-bottom" style="margin-top:12px"><div class="placeholder small">사진 · 사주 · 타로 카페 거리</div><div class="tile"><b>믿음 27% vs 이용 46%</b><p>점·사주 신뢰</p><div class="meter"><span style="width:27%"></span></div><p>AI 운세 이용</p><div class="meter"><span style="width:46%"></span></div></div></div>'},
{tag:"행동 · 트렌드",title:"읽는 운세에서,<br>찾아가는 운세로",desc:"‘기 받으러’ 관악산을 찾는 방문객이 1년 새 41.2% 늘었습니다.",source:"‘기 받으러’ 방문 · 방문객 집계 · 점괘와 위험 감수",more:"<p>관악산 연주대 방문 사례는 운과 관련된 콘텐츠가 실제 장소 방문을 유도하는 하나의 문화적 단서가 됩니다.</p><p>Tan 외(2022)의 점괘 실험은 긍정적인 점괘가 일부 참여자의 위험 감수 행동에 영향을 줄 가능성을 보여줍니다. 다만 이 실험을 관악산 방문 증가의 원인으로 연결할 수는 없습니다.</p><p>방문객 증가 수치는 집계 기간과 비교 기준을 함께 확인해 해석해야 합니다.</p>",right:'<div class="placeholder square" style="margin-left:127px">사진 · 관악산 연주대<span class="pill photo-pill">연주대 · 2026.4</span></div>',bottom:'<section class="accent"><span class="pill" style="background:white">방송 이후 · 관악산 방문</span><div class="accent-grid"><div><h2>운에 대한 관심이<br>직접 찾아가는 경험으로</h2><div class="fact"><b>Tan 외(2022) · n=886</b><p>긍정적 점괘를 받은 남성이 재무 위험을 더 감수</p></div></div><div class="placeholder">사진 · 등산로를 오르는 사람들</div><div class="placeholder">사진 · SNS 후기 캡처</div><div class="stats"><div class="stat"><strong>+41.2%</strong><small>방문객 증가</small></div><div class="stat"><strong>5,521</strong><small>2026.4 방문객</small></div><div class="stat"><strong>n=886</strong><small>점괘 실험 참여자</small></div></div></div></section>'},
{tag:"인문학 · 행동",title:"행동에 따라<br>달라질 수 있는 운",desc:"순자와 와이즈먼에게서 ‘오늘 내가 고를 수 있는 일’을 읽었습니다.",source:"순자 「천론」 · 와이즈먼 · 기회 포착",more:"<p>순자의 「천론」은 자연의 질서와 인간이 할 일을 구분합니다. 주어진 상황을 통제하려 하기보다 그 속에서 가능한 행동에 주목하는 관점입니다.</p><p>Richard Wiseman의 『The Luck Factor』(2003)는 기회를 알아차리는 태도, 새로운 경험을 향한 개방성 등을 행운의 행동적 관점에서 설명합니다.</p>",carousel:true},
{tag:"공간 경험",title:"같은 장소도<br>무엇을 하느냐에 따라 다른 경험",desc:"장소의 속성뿐 아니라, 그곳에서 무엇을 하는지가 경험을 만듭니다.",source:"장소 애착 · 의례와 공동체 · 일반화 주의",more:"<p>Mazumdar & Mazumdar(2004)는 종교적 장소에서 의례, 관계와 장소 애착의 연관성을 다룹니다. 장소를 단순한 위치가 아니라 경험과 관계가 쌓이는 맥락으로 바라보는 참고 근거입니다.</p><p>종교적 장소를 다룬 연구 결과를 일상적인 산책이나 운세 탐험의 효과로 직접 일반화해서는 안 됩니다.</p>",right:'<div class="placeholder square" style="margin-left:127px">사진 · 동네 공원 · 산책로 (서울숲 등)<span class="pill photo-pill">● 보기　● 걷기　● 머무르기</span></div>',bottom:'<section class="accent"><span class="pill" style="background:#fff">Mazumdar & Mazumdar (2004)</span><div class="accent-grid"><div><h2>장소 애착은<br>그곳에서 한 행동과 함께 생긴다</h2><div class="fact"><b>주의</b><p>종교적 장소 연구 — 일상 산책의 효과로 일반화하지 않음</p></div></div><div class="placeholder">사진 · 벤치에 머무는 사람</div><div class="placeholder">사진 · 사진으로 기록하는 손</div><div class="r5stats"><div><b>장소</b></div><div><b>의례<br>행동</b></div><div><b>함께한<br>사람</b></div></div></div></section>'},

let page=0;
const content=document.getElementById("content"),viewport=document.getElementById("viewport"),footer=document.getElementById("footer");
function detail(p){return '<details class="research-details"><summary>'+p.source+'</summary><div class="detail-copy">'+p.more+'</div></details>'}
function render(){const p=pages[page];content.className="page-r"+(page+1);content.innerHTML=p.dark?'<section class="dark"><div class="dark-panel"><span class="pill" style="background:#000;color:var(--sky)">● 데스크리서치 → 인터뷰</span><div class="eyebrow">우리의 질문</div><p style="font-size:28px">데스크리서치가 남긴 질문</p><h1>사주에서 얻은 실마리가, 오늘 새로운<br>경험을 고르는 계기가 될 수 있을까?</h1><p>이 가능성을 확인하기 위해 사람들이 실제로 참고한 조언, 따라 해 본 행동, 장소 방문을 망설인 이유를 물었습니다.</p><button id="interview-cta">인터뷰 결과 보기 →</button><div class="questions"><div><b>01</b><span>참고한 조언</span></div><div><b>02</b><span>따라 해 본 행동</span></div><div><b>03</b><span>망설인 이유</span></div></div></div></section>':p.carousel?'<section class="r4-layout"><div><div class="eyebrow">'+p.tag+'</div><h1 class="hero">'+p.title+'</h1></div><div><p class="intro">'+p.desc+'</p>'+detail(p)+'</div></section><div class="carousel-toolbar"><button id="slide-prev" aria-label="이전 카드">‹</button><button id="slide-next" aria-label="다음 카드">›</button></div><div class="carousel" id="carousel" aria-label="연구 관점 슬라이드">'+slides.map((s,i)=>'<article class="slide"><div class="s-img">'+s[0]+'</div><div class="s-body"><b>'+s[1]+'</b><strong>'+s[2]+'</strong></div></article>').join('')+'</div>':'<section><div class="toplayout"><div class="leftcopy"><div class="eyebrow">'+p.tag+'</div><h1 class="hero">'+p.title+'</h1><p class="intro">'+p.desc+'</p>'+detail(p)+'</div><div class="right">'+p.right+'</div></div>'+(p.bottom||'')+'</section>';document.getElementById("indices").innerHTML=["00","01","02","03","04","Q"].map((label,i)=>'<button aria-label="리서치 '+label+'" '+(i===page?'aria-current="page" class="current"':'')+' data-page="'+i+'">'+label+'</button>').join('');document.querySelectorAll("[data-page]").forEach(el=>el.addEventListener("click",()=>go(+el.dataset.page)));footer.classList.toggle("dark-footer",!!p.dark);document.getElementById("prev").disabled=page===0;document.getElementById("next").disabled=page===5;document.getElementById("prev").style.opacity=page===0?".25":"1";document.getElementById("next").style.opacity=page===5?".25":"1";viewport.scrollTop=0;content.querySelectorAll("details").forEach(el=>el.addEventListener("toggle",()=>{if(el.open&&typeof gtag==="function")gtag("event","research_more_open",{research_page:page+1})}));if(p.carousel){const car=document.getElementById("carousel");document.getElementById("slide-prev").onclick=()=>car.scrollBy({left:-396,behavior:"smooth"});document.getElementById("slide-next").onclick=()=>car.scrollBy({left:396,behavior:"smooth"})}if(p.dark)document.getElementById("interview-cta").onclick=()=>{location.href="./index.html#interview"};if(typeof gtag==="function")gtag("event","research_page",{research_page:page+1})}
function go(n){if(n<0||n>=pages.length)return;page=n;render()}
document.getElementById("prev").onclick=()=>go(page-1);document.getElementById("next").onclick=()=>go(page+1);document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"&&e.target.tagName!=="SUMMARY")go(page+1);if(e.key==="ArrowLeft"&&e.target.tagName!=="SUMMARY")go(page-1)});document.getElementById("brand").onclick=()=>location.href="./index.html";document.getElementById("tab-research").onclick=()=>go(0);document.getElementById("tab-interview").onclick=()=>location.href="./index.html#interview";document.getElementById("tab-service").onclick=()=>location.href="./index.html#service";document.getElementById("tab-team").onclick=()=>location.href="./index.html#team";
