<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff">
<title>Steer · Luck Lens 사진</title>
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/fonts/pretendard/pretendard.css">
<style>
  /* Luck Lens 촬영 결과 저장 페이지(관람객 스마트폰). 사진 ID는 주소의 # 뒤에만 있다.
     레이아웃: Figma 2026 채으닝 2566:20154 카드(968×1214)를 화면 폭에 맞춰 비율 그대로 축소한다. --w = 카드 실제 폭, --u = 1 Figma px
     · 카드 0,0 968×1214 #0A0A0A, 모서리 140 · 원형 사진(Ellipse) 134,105 699×699 · Steer 로고 292,847 384.719×281.141
     · 촬영 사진(900×900)의 렌즈 원(중심 450,440 · 반지름 400 + 테두리 6)을 Figma 원 699에 정확히 맞춰 원형 영역 안에 배치 */
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:#0A0A0A}
  body{--w:min(calc(100vw - 40px), calc((100vh - 210px) * 968 / 1214), 460px);--u:calc(var(--w) / 968);min-height:100vh;min-height:100dvh;font-family:Pretendard,'Noto Sans KR',system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));word-break:keep-all}
  @supports (height:100dvh){body{--w:min(calc(100vw - 40px), calc((100dvh - 210px) * 968 / 1214), 460px)}}
  main{display:flex;flex-direction:column;align-items:center;width:var(--w)}
  .card{position:relative;width:var(--w);height:calc(var(--u) * 1214);border-radius:calc(var(--u) * 140);background:#0A0A0A;overflow:hidden;color:#fff;flex:none}
  /* 원형 사진 영역(기존 .ph 재사용) */
  .ph{position:absolute;left:calc(var(--u) * 134);top:calc(var(--u) * 105);width:calc(var(--u) * 699);height:calc(var(--u) * 699);border-radius:50%;overflow:hidden;background:#141414;box-shadow:inset 0 0 0 calc(var(--u) * 10.33) #ff8778;display:flex;align-items:center;justify-content:center}
  .ready .ph{background:#0A0A0A;box-shadow:none}
  /* 사진 900px → 원 699px: 배율 699/812, 사진 원 중심(450,440)을 Figma 원 중심에 맞춤 */
  .ph img{position:absolute;left:calc(var(--u) * -37.88);top:calc(var(--u) * -29.27);width:calc(var(--u) * 774.75);height:calc(var(--u) * 774.75);max-width:none;opacity:0;transition:opacity .3s ease;-webkit-touch-callout:default}
  .ready .ph img{opacity:1}
  .logo{position:absolute;left:calc(var(--u) * 292);top:calc(var(--u) * 847);width:calc(var(--u) * 384.719);height:calc(var(--u) * 281.141)}
  .logo img{position:absolute;left:0;top:0;width:101.04%;height:101.422%;max-width:none;display:block}
  .spin{width:calc(var(--u) * 72);height:calc(var(--u) * 72);border-radius:50%;border:calc(var(--u) * 7) solid rgba(255,255,255,.16);border-top-color:#ff8778;animation:sp .9s linear infinite}
  .ready .spin,.gone .spin{display:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  .msg{display:none;padding:0 calc(var(--u) * 70);text-align:center}
  .msg h1{margin:0;font-size:calc(var(--u) * 46);font-weight:600;line-height:1.4;letter-spacing:-.01em}
  .msg p{margin:calc(var(--u) * 18) 0 0;font-size:calc(var(--u) * 32);line-height:1.5;color:rgba(255,255,255,.6)}
  .gone .msg{display:block}
  .save{margin-top:20px;width:100%;height:56px;border:0;border-radius:28px;background:#0A0A0A;color:#fff;font:600 18px/56px Pretendard,'Noto Sans KR',system-ui,sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s ease,opacity .2s ease}
  .save:active{transform:scale(.97)}
  .save:disabled{opacity:.3}
  .gone .save,.gone .tip{display:none}
  .tip{margin:12px 0 0;font-size:13px;line-height:1.5;color:rgba(10,10,10,.55);text-align:center}
  footer{margin-top:14px;font-size:12px;line-height:1.5;color:rgba(10,10,10,.4);text-align:center}
  /* 저장용 합성 카드: 화면에는 보이지 않고, 길게 눌렀을 때만 이 이미지가 저장된다 */
  .cardshot{position:absolute;inset:0;width:100%;height:100%;opacity:.01;-webkit-touch-callout:default}
  .cardshot[hidden]{display:none}
  @media (prefers-reduced-motion:reduce){.spin{animation-duration:2.5s}.ph img{transition:none}}
</style>
</head>
<body>
<main id="m" aria-busy="true">
  <div class="card">
    <div class="ph"><span class="spin" aria-hidden="true"></span><img id="img" alt="Luck Lens로 촬영한 오행 필터 사진"><div class="msg" role="alert"><h1 id="mh"></h1><p id="mp"></p></div></div>
    <div class="logo"><img src="assets/lens/photo-steer-logo.svg" alt="Steer"></div>
    <img id="cardshot" class="cardshot" alt="Luck Lens 사진 카드" hidden>
  </div>
  <button class="save" id="save" type="button" disabled>사진 저장</button>
  <p class="tip" id="tip">저장이 되지 않으면 카드를 길게 눌러 저장해 주세요.</p>
</main>
<footer id="ft">2026 졸업전시 · Steer</footer>
<script type="module">
import {shareConfig, shareEnabled, publicURL, ID_RE} from './assets/lens/share.js';
const $ = id => document.getElementById(id), m = $('m'), img = $('img'), btn = $('save');
const TTL = shareConfig.ttlHours * 3600e3, NAME = 'Steer-Luck-Lens.jpg';
const id = decodeURIComponent((location.hash || '').slice(1));
$('ft').textContent = '사진은 촬영 후 ' + shareConfig.ttlHours + '시간이 지나면 자동으로 삭제됩니다.';
function gone(h, p){ m.classList.add('gone'); m.removeAttribute('aria-busy'); $('mh').textContent = h; $('mp').textContent = p; btn.disabled = true; }

// ---- 저장 이미지: Figma 2566:20154 카드(968×1214)를 화면과 같은 좌표로 Canvas에 합성 → 고정 해상도 JPEG
// 화면 크기와 무관하게 항상 CARD_SCALE배(1936×2428)로 출력한다. 저장 버튼 · 안내 문구 등 페이지 UI는 넣지 않는다.
// 카드 바깥 모서리(둥근 모서리 밖)는 JPEG에 투명이 없어 페이지 배경과 같은 흰색으로 채운다.
const CARD = {w:968, h:1214, r:140, bg:'#0A0A0A', outside:'#ffffff'};
const CIRCLE = {x:134, y:105, d:699};                         // Figma Ellipse
const PHOTO = {x:134 - 37.88, y:105 - 29.27, size:774.75};    // 900px 촬영 사진의 렌즈 원(중심 450,440 · 지름 812)을 원 699에 맞춘 위치(CSS와 동일)
const LOGO = {x:292, y:847, w:388.719, h:285.138};            // Figma Group 2147227886 · SVG 원본 크기(CSS: 384.719 상자에 101.04%)
const CARD_SCALE = 2, JPEG_Q = .92;
const loadImg = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('image ' + src)); i.src = src; });
async function composeCard(photo){
  const logo = await loadImg(new URL('assets/lens/photo-steer-logo.svg', location.href).href);
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch {}
  const c = document.createElement('canvas'); c.width = CARD.w * CARD_SCALE; c.height = CARD.h * CARD_SCALE;
  const g = c.getContext('2d'); g.scale(CARD_SCALE, CARD_SCALE); g.imageSmoothingQuality = 'high';
  g.fillStyle = CARD.outside; g.fillRect(0, 0, CARD.w, CARD.h);
  g.save(); g.beginPath(); g.roundRect ? g.roundRect(0, 0, CARD.w, CARD.h, CARD.r) : roundRect(g, 0, 0, CARD.w, CARD.h, CARD.r); g.clip();
  g.fillStyle = CARD.bg; g.fillRect(0, 0, CARD.w, CARD.h);
  // 원형 마스크 안에 촬영 사진(오행 필터 · 손바닥 스티커 · 렌즈 테두리 포함)
  g.save(); g.beginPath(); g.arc(CIRCLE.x + CIRCLE.d / 2, CIRCLE.y + CIRCLE.d / 2, CIRCLE.d / 2, 0, Math.PI * 2); g.clip();
  g.drawImage(photo, PHOTO.x, PHOTO.y, PHOTO.size, PHOTO.size); g.restore();
  g.drawImage(logo, LOGO.x, LOGO.y, LOGO.w, LOGO.h);
  g.restore();
  const blob = await new Promise((ok, no) => c.toBlob(b => b ? ok(b) : no(new Error('toBlob')), 'image/jpeg', JPEG_Q));
  return blob;
}
function roundRect(g, x, y, w, h, r){ g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

let file = null, cardURL = '';
async function load(){
  if (!shareEnabled() || !ID_RE.test(id)) return gone('사진을 찾을 수 없어요', 'QR 코드를 다시 스캔해 주세요.');
  try {
    const r = await fetch(publicURL(id), {cache:'no-store'});
    if (r.status === 400 || r.status === 404) return gone('사진 보관 기간이 지났어요', '촬영한 사진은 ' + shareConfig.ttlHours + '시간 동안만 보관됩니다.');
    if (!r.ok) throw new Error(String(r.status));
    const lm = Date.parse(r.headers.get('last-modified') || '');
    if (lm && Date.now() - lm > TTL) return gone('사진 보관 기간이 지났어요', '촬영한 사진은 ' + shareConfig.ttlHours + '시간 동안만 보관됩니다.');
    const b = await r.blob();
    await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = URL.createObjectURL(b); });
    m.classList.add('ready'); m.removeAttribute('aria-busy');
    // 공유 시트는 버튼을 누른 직후에 열어야 하므로(iOS 사용자 동작 제한) 저장 이미지를 미리 합성해 둔다
    const card = await composeCard(img);
    file = new File([card], NAME, {type:'image/jpeg'}); cardURL = URL.createObjectURL(card);
    const shot = $('cardshot'); shot.src = cardURL; shot.hidden = false;   // 카드를 길게 눌러 저장해도 합성 이미지가 저장되도록 투명하게 덮는다
    btn.disabled = false;
    window.steerPhotoCard = {width:CARD.w * CARD_SCALE, height:CARD.h * CARD_SCALE, bytes:card.size};
  } catch {
    gone('사진을 불러오지 못했어요', '네트워크 연결을 확인한 뒤 새로고침해 주세요.');
  }
}
// iOS·Android: 공유 시트의 '이미지 저장'으로 사진 앱에 바로 저장. 지원하지 않는 브라우저는 파일 다운로드. 둘 다 합성 카드 JPEG를 쓴다
btn.addEventListener('click', async () => {
  if (!file) return;
  if (navigator.canShare && navigator.canShare({files:[file]}) && matchMedia('(pointer:coarse)').matches) {
    try { await navigator.share({files:[file]}); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = cardURL; a.download = NAME; document.body.appendChild(a); a.click(); a.remove();
});
load();
</script>
</body>
</html>
